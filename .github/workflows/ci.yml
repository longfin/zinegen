name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (pango for WeasyPrint, ghostscript for proofs, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 ghostscript fontconfig fonts-dejavu-core fonts-nanum
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]" ruff
      - run: .venv/bin/ruff check .
      - name: CMYK profile for the PDF/X-1a tests (Ghostscript's default_cmyk.icc, installed with ghostscript)
        run: find /usr/share -name default_cmyk.icc
      - run: .venv/bin/python -m pytest -q
        env:
          ZINEGEN_REQUIRE_CMYK: "1"   # fail rather than skip the X-1a tests if no CMYK profile is found
      - name: Package builds and ships its data files
        run: |
          uv build
          unzip -l dist/*.whl | grep -E "schema/book.schema.json|templates/book.html.j2|templates/sRGB2014.icc"
