[project]
name = "zinegen"
version = "0.3.0"
description = "Agent-driven photobook typesetting: Lightroom album -> print-ready PDF/X"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swen Mun" }]
keywords = ["photobook", "lightroom", "pdf/x", "prepress", "mcp", "agent", "weasyprint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",
]
dependencies = [
  "lr-mcp>=0.4",
  "mcp>=2.3,<3",
  "weasyprint>=66",
  "pillow>=11",
  "pikepdf>=9",
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/longfin/zinegen"
Issues = "https://github.com/longfin/zinegen/issues"
Changelog = "https://github.com/longfin/zinegen/blob/main/CHANGELOG.md"

[project.scripts]
zinegen = "zinegen.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zinegen"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["probe", "books"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
